; worker-01 — blueprint §10
[program:kea-horizon]
command=php /var/www/kea-api/current/artisan queue:work redis --queue=critical,default,low --tries=5 --max-time=3600
user=deploy
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/var/log/kea/worker.log

[program:kea-scheduler]
command=php /var/www/kea-api/current/artisan schedule:work
user=deploy
autostart=true
autorestart=true
stdout_logfile=/var/log/kea/scheduler.log

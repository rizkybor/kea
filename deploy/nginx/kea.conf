# app-01 — blueprint §10. Ganti [DOMAIN] dan path sertifikat TLS.
server {
    listen 443 ssl http2;
    server_name [DOMAIN];

    ssl_certificate     /etc/ssl/kea/fullchain.pem;
    ssl_certificate_key /etc/ssl/kea/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 25m; # tugas maks. 20 MB

    location /api/ {
        root /var/www/kea-api/current/public;
        try_files $uri /index.php?$query_string;
    }
    location ~ ^/(admin|sanctum|livewire|css/filament|js/filament|fonts/filament|brand|storage)(/|$) {
        root /var/www/kea-api/current/public;
        try_files $uri /index.php?$query_string;
    }
    location ~ \.php$ {
        root /var/www/kea-api/current/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
    location /_nuxt/ {
        alias /var/www/kea-web/current/.output/public/_nuxt/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name [DOMAIN];
    return 301 https://$host$request_uri;
}

# Listener internal untuk SSR Nuxt (proxy /api dari Nitro) tanpa lewat Cloudflare/TLS.
server {
    listen 127.0.0.1:8080;
    root /var/www/kea-api/current/public;
    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
